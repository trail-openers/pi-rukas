name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # #337 — a PR authored with the default GITHUB_TOKEN does not
          # trigger `on: pull_request` workflows. That is GitHub's
          # anti-recursion rule, not a permissions failure: nothing is denied,
          # the runs are simply created with zero jobs and conclude
          # `action_required`. Every release PR to date has therefore merged
          # with NO CI having run on it.
          #
          # Confirmed by executed evidence: release PRs are authored by
          # `app/github-actions` and their runs report `total_count: 0` jobs,
          # while Dependabot's PRs — same repo, same workflow, same trigger,
          # but a distinct identity (`app/dependabot`) — run and pass.
          #
          # A PAT gives the PR a real identity, so `pull_request` fires
          # normally. RELEASE_PAT needs Contents: write (push the branch, tag
          # the release) and Pull requests: write (open and update the PR).
          # It does NOT need `workflows` — that scope only governs pushing
          # changes to `.github/workflows/`, which a release PR never does.
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishes the release to npm, which is what lists the package in the Pi
  # package gallery (pi.dev/packages indexes npm packages carrying the
  # `pi-package` keyword). Authentication is npm trusted publishing: the
  # OIDC token from `id-token: write` replaces a long-lived NPM_TOKEN, and
  # the same token signs the provenance attestation. `prepack` builds the
  # role prompts into the tarball, which needs jq (preinstalled on
  # ubuntu-latest).
  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
