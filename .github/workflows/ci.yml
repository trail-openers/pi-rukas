name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to a known-good exact version. `latest` broke CI with no
          # repo change when bun 1.4.0 started stringifying
          # `process.env.X = undefined` (issue #502). Toolchain upgrades are a
          # deliberate, reviewed change: bump here, verify locally + in a
          # throwaway branch, then merge.
          bun-version: 1.3.13

      - name: Install jq (build.sh dependency)
        run: |
          if ! command -v jq >/dev/null; then sudo apt-get install -y jq; fi

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('extension/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build per-role system prompts
        run: bun run build

      - name: Install extension deps
        working-directory: extension
        run: bun install --frozen-lockfile

      - name: Type-check
        working-directory: extension
        run: bunx tsc --noEmit

      - name: Lint (biome)
        working-directory: extension
        run: bun run check

      - name: Offline smoke tests
        working-directory: extension
        run: |
          for t in smoke-tests/test-*.ts; do
            case "$t" in *-live.ts) continue;; esac
            echo "--- $t"
            bun run "$t" || exit 1
          done
