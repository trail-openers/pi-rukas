version: 2

# This file configures Dependabot for github-actions updates only.
#
# npm/bun updates are deliberately absent: Dependabot does not regenerate
# `extension/bun.lock`, so every npm PR it opens fails CI on
# `bun install --frozen-lockfile` (see #329).
# `extension/` dependencies are bumped manually, regenerating the lockfile
# in the same commit.
#
# The 4-day release-age embargo in `extension/bunfig.toml` and
# `extension/.npmrc` still applies to every install — enforced at install
# time, regardless of how the bump arrives.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
